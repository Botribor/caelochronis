# Ripristino una tantum: GitHub Pages ha conservato un vecchio deployment
# "in progress" dopo l'annullamento di un run. Nessun dato meteo viene modificato.
name: Sblocca pubblicazione Caelochronis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unblock-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Annulla SOLO il deployment GitHub Pages bloccato
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_ID="251511abf0ba905d43de400712a3440c90fc026c"
          RESPONSE_CODE="$(curl --silent --show-error --output /tmp/pages-cancel-response \
            --write-out '%{http_code}' --request POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Botribor/caelochronis/pages/deployments/${DEPLOY_ID}/cancel")"
          if [ "$RESPONSE_CODE" != "204" ]; then
            echo "::error::Annullamento GitHub Pages non riuscito: HTTP $RESPONSE_CODE"
            cat /tmp/pages-cancel-response
            exit 1
          fi
          echo "Annullamento deployment bloccato accettato da GitHub (HTTP 204)."
