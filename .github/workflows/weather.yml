name: Aggiorna dati meteo Caelochronis

on:
  schedule:
    # Backup: una volta al giorno, nel caso Cloudflare sia indisponibile.
    # Aggiornamenti ordinari ogni 10 minuti: Cloudflare -> workflow_dispatch.
    - cron: '7 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caelochronis-weather-update
  cancel-in-progress: false

jobs:
  publish-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il sito
        uses: actions/checkout@v4
      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leggi la stazione IDALMI6
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: python scripts/fetch_weather.py
      - name: Pubblica il JSON aggiornato
        run: |
          if [ -n "$(git status --porcelain -- data/latest.json data/history/)" ]; then
            git config user.name 'caelochronis-weather-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/latest.json data/history/
            git commit -m 'Aggiorna osservazioni meteo IDALMI6'
            # Il sito può essere modificato mentre si leggono i dati.
            # Reintegra la punta del branch e ritenta un push fast-forward.
            for tentativo in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Dati meteorologici pubblicati (tentativo $tentativo)."
                break
              fi
              if [ "$tentativo" -eq 3 ]; then
                echo "::error::GitHub ha rifiutato il push dopo 3 tentativi."
                exit 1
              fi
              sleep 3
            done
          else
            echo 'Nessun aggiornamento da pubblicare.'
          fi
