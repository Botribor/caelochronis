name: Aggiorna dati meteo Caelochronis

on:
  schedule:
    # Backup: una volta al giorno, nel caso Cloudflare sia indisponibile.
    # Aggiornamenti ordinari ogni 10 minuti: Cloudflare -> workflow_dispatch.
    - cron: '7 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caelochronis-weather-update
  cancel-in-progress: false

jobs:
  publish-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il sito
        uses: actions/checkout@v4
      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Raccogli e pubblica i dati senza conflitti
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'caelochronis-weather-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Leggi sempre il branch aggiornato PRIMA di modificare dati/latest.json
          # e lo storico. Se qualcun altro salva nel frattempo, riparti dalla
          # versione più recente e ricalcola i dati; non usare git rebase sui JSON.
          for tentativo in 1 2 3 4; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python scripts/fetch_weather.py
            if [ -z "$(git status --porcelain -- data/latest.json data/history/)" ]; then
              echo 'Dati già aggiornati: nessuna modifica da pubblicare.'
              exit 0
            fi
            git add data/latest.json data/history/
            git commit -m 'Aggiorna osservazioni meteo IDALMI6'
            if git push origin HEAD:main; then
              echo "Dati meteorologici pubblicati (tentativo $tentativo)."
              exit 0
            fi
            if [ "$tentativo" -eq 4 ]; then
              echo "::error::Push non riuscito dopo 4 tentativi."
              exit 1
            fi
            echo "Il branch è cambiato durante il salvataggio: riprovo."
            sleep 3
          done
